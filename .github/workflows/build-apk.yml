name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichViet-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (link tải trực tiếp)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep versionName app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk LichViet.apk
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --title "Lịch Việt $VER" --notes "Bản build tự động từ nhánh main. Tải file LichViet.apk để cài."
          gh release upload "v$VER" LichViet.apk --clobber
