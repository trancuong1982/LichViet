plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.cuong.lichviet'
    compileSdk 34

    defaultConfig {
        applicationId "vn.cuong.lichviet"
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName "2.15"
    }

    // Khóa ký cố định để các bản cập nhật cài đè lên nhau được (không phải gỡ app)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
