<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tùy chỉnh widget</title>
<link rel="stylesheet" href="style.css">
<style>
main{padding-bottom:110px}
.stage{border-radius:26px;padding:22px 14px;min-height:170px;display:flex;align-items:center;justify-content:center;transition:background .3s}
.stage.w1{background:linear-gradient(165deg,#C8D3EE,#E9DCEB 55%,#F6E3D3)}
.stage.w2{background:linear-gradient(165deg,#0F1626,#1E2B47 60%,#3B2F4A)}
.stage.w3{background:radial-gradient(circle at 80% 10%,#FFB36B 0,transparent 35%),linear-gradient(170deg,#1F3B73,#2F6E9E 50%,#5FA8B8)}
.wg{position:relative;width:100%;max-width:360px;border-radius:24px;overflow:hidden}
.wg .bgl{position:absolute;inset:0}.wg .c{position:relative;padding:14px 16px}
.wg.wall .c{text-shadow:0 1px 3px rgba(0,0,0,.35)}
.row{display:flex;align-items:center}.f1{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi{display:inline-block}.wi svg{width:100%;height:100%;display:block}
.ck{line-height:1;letter-spacing:-1px}
.cp{display:inline-block;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700}
.rf{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-left:6px}
.sw{width:34px;height:34px;border-radius:50%;border:0;flex:none}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tile)}
input[type=range]{width:100%;accent-color:var(--tile)}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg input{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:14px;position:relative;transition:.2s;flex:none;margin:0}
.tg input::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked{background:var(--tile)}.tg input:checked::after{left:22px}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin:10px 0 6px}.lab b{color:var(--tx)}
.bar2{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.bar2 button{flex:1;border:0;border-radius:24px;padding:15px;font-size:15px;font-weight:600}
.save{background:var(--tile);color:#fff}.cancel{background:var(--surf2);color:var(--tx)}
.hide{display:none!important}
</style>
</head>
<body>
<main style="display:flex;flex-direction:column;gap:12px">
  <div class="sh"><button id="btnBack" aria-label="Quay lại">‹</button><b id="title">Tùy chỉnh widget</b></div>
  <div class="chips" id="walls"></div>
  <div class="stage w3" id="stage"><div class="wg" id="wg"><div class="bgl" id="bgl"></div><div class="c" id="content"></div></div></div>

  <div class="card">
    <div class="sec">NỀN</div>
    <div class="chips" id="bgmode"></div>
    <div class="lab">Độ đậm nền <b id="opv"></b></div>
    <input type="range" min="0" max="100" step="5" id="opacity" aria-label="Độ đậm nền">
    <div class="lab">Giao diện</div><div class="chips" id="theme"></div>
    <div class="lab">Màu chủ đạo</div><div class="chips" id="accent"></div>
    <div class="lab">Màu chữ</div><div class="chips" id="text"></div>
  </div>
  <div class="card" id="secClock">
    <div class="sec">NGÀY GIỜ</div>
    <div class="chips" id="h24"></div>
    <div class="chips" id="bold" style="margin-top:8px"></div>
    <div class="chips" id="date" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <div class="tg" id="tLunar">Âm lịch <input type="checkbox" id="lunar" aria-label="Âm lịch"></div>
    <div class="tg" id="tWeek">Số tuần trong năm <input type="checkbox" id="week" aria-label="Số tuần"></div>
    <div class="tg" id="tWeather">Thời tiết &amp; dự báo mưa <input type="checkbox" id="weather" aria-label="Thời tiết"></div>
    <div class="tg" id="tPlace">Tên địa điểm <input type="checkbox" id="place" aria-label="Địa điểm"></div>
    <div class="tg" id="tTuoi">Tốt xấu theo tuổi <input type="checkbox" id="tuoi" aria-label="Theo tuổi"></div>
  </div>
  <div class="note">Nút ⟳ trên widget để cập nhật thời tiết ngay. Chu kỳ tự cập nhật chỉnh trong Cài đặt của app.</div>
</main>
<div class="bar2"><button class="cancel" id="btnCancel">Hủy</button><button class="save" id="btnSave">Lưu widget</button></div>

<script src="icons.js"></script>
<script src="wx.js"></script>
<script src="lunar.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var B = window.CfgBridge || { getType: function () { return new URLSearchParams(location.search).get("type") || "clock"; },
    getConfig: function () { return window.__mockCfg || "{}"; }, getWeather: function () { return window.__mockWeather || ""; },
    isDark: function () { return !!window.__mockDark; }, getBirth: function () { return "1985-05-12"; },
    save: function (j) { console.log("save", j); }, cancel: function () {} };
  var DARK = false; try { DARK = B.isDark(); } catch (e) {}
  document.body.classList.toggle("dark", DARK);
  var TYPE = B.getType();
  var NAMES = { clock: "Đồng hồ & Lịch", date: "Ngày · Tuần · Âm lịch", weather: "Thời tiết", calendar: "Lịch ngày", compact: "Thanh gọn" };
  var THU = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"], THU_N = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  var THANG = ["", "Giêng", "Hai", "Ba", "Tư", "Năm", "Sáu", "Bảy", "Tám", "Chín", "Mười", "Một", "Chạp"];
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var cfg = { opacity: 95, theme: "auto", accent: "blue", text: "auto", date: "full", h24: true, bold: true, lunar: true, weather: true, week: true, place: true, tuoi: true };
  try { var sv = JSON.parse(B.getConfig() || "{}"); for (var k in sv) cfg[k] = sv[k]; } catch (e) {}
  var data = null; try { var r = B.getWeather(); if (r) data = JSON.parse(r); } catch (e) {}
  var birth = ""; try { birth = B.getBirth(); } catch (e) {}

  $("title").textContent = "Widget " + NAMES[TYPE];
  var hide = function (id) { $(id).classList.add("hide"); };
  if (TYPE !== "clock" && TYPE !== "compact") hide("secClock");
  if (TYPE === "compact") { hide("date"); }
  if (TYPE === "weather") { hide("tLunar"); hide("tWeek"); }
  if (TYPE === "date") { hide("tWeather"); hide("tPlace"); hide("tLunar"); }
  if (TYPE === "calendar" || TYPE === "compact") hide("tPlace");
  if (TYPE !== "date") hide("tTuoi");

  var ACC = { blue: ["#2D4BA0", "#B9C8FF"], green: ["#1F7A5C", "#7FD8B0"], orange: ["#C2620E", "#F4A65A"], purple: ["#6B4FBB", "#CDBDFF"], system: ["#3E5F90", "#A8C8FF"] };
  function pal() {
    var dark = cfg.theme === "dark" || (cfg.theme === "auto" && DARK);
    var wall = cfg.text === "white" || (cfg.text === "auto" && cfg.opacity < 35);
    var p = { surface: dark ? "#1C212B" : "#F6F8FD", wall: wall };
    if (wall) { p.fg = "#fff"; p.fg2 = "rgba(255,255,255,.9)"; p.acc = "#fff"; p.red = "#FFC2B8"; p.rain = "#CFE6FF";
      p.cA = "rgba(255,255,255,.25)"; p.oA = "#fff"; p.cB = "rgba(255,255,255,.25)"; p.oB = "#fff"; return p; }
    var dt = cfg.text === "dark" || (cfg.text !== "white" && !dark);
    p.fg = dt ? "#1B1F2A" : "#E7EAF2"; p.fg2 = dt ? "#5A6275" : "#A9B1C2"; p.acc = ACC[cfg.accent][dt ? 0 : 1];
    p.red = dt ? "#C0392B" : "#FF8A7A"; p.rain = dt ? "#2D6FD8" : "#8DB8FF";
    p.cA = dark ? "#4A3220" : "#FFE2C7"; p.oA = dark ? "#FFDCC0" : "#5C3410"; p.cB = dark ? "#26345F" : "#DDE5FF"; p.oB = dark ? "#D6E0FF" : "#1F3A80";
    return p;
  }

  function chips(id, opts, key, cb) {
    $(id).innerHTML = opts.map(function (o) { return '<button class="chp" data-v=\'' + JSON.stringify(o[0]) + '\'>' + o[1] + "</button>"; }).join("");
    $(id).querySelectorAll(".chp").forEach(function (b) { b.onclick = function () { cfg[key] = JSON.parse(b.getAttribute("data-v")); if (cb) cb(); sync(); }; });
  }
  chips("bgmode", [[95, "Đặc"], [45, "Mờ"], [0, "Trong suốt"]], "opacity");
  chips("theme", [["auto", "Theo máy"], ["light", "Sáng"], ["dark", "Tối"]], "theme");
  chips("text", [["auto", "Tự động"], ["white", "Trắng"], ["dark", "Tối"]], "text");
  chips("h24", [[true, "24 giờ"], [false, "12 giờ"]], "h24");
  chips("bold", [[true, "Số đậm"], [false, "Số mảnh"]], "bold");
  var now = new Date(), d = now.getDate(), m = now.getMonth() + 1, y = now.getFullYear(), wd = now.getDay();
  chips("date", [["full", THU[wd] + ", " + pad(d) + "/" + pad(m) + "/" + y], ["long", THU[wd] + ", " + d + " tháng " + m], ["short", THU_N[wd] + " · " + pad(d) + "/" + pad(m)]], "date");
  $("accent").innerHTML = [["blue", "#2D4BA0"], ["green", "#1F7A5C"], ["orange", "#C2620E"], ["purple", "#6B4FBB"], ["system", "conic-gradient(#F6B73C,#2D4BA0,#1F7A5C,#F6B73C)"]].map(function (a) {
    return '<button class="sw" data-v="' + a[0] + '" style="background:' + a[1] + '" aria-label="' + (a[0] === "system" ? "Theo hình nền" : a[0]) + '"></button>';
  }).join("");
  $("accent").querySelectorAll(".sw").forEach(function (b) { b.onclick = function () { cfg.accent = b.getAttribute("data-v"); sync(); }; });
  $("opacity").oninput = function () { cfg.opacity = parseInt(this.value, 10); sync(); };
  ["lunar", "weather", "week", "place", "tuoi"].forEach(function (k) { $(k).onchange = function () { cfg[k] = this.checked; sync(); }; });
  var walls = [["w3", "Hình nền ảnh"], ["w1", "Nền sáng"], ["w2", "Nền tối"]];
  $("walls").innerHTML = walls.map(function (w, i) { return '<button class="chp' + (i ? "" : " on") + '" data-w="' + w[0] + '">' + w[1] + "</button>"; }).join("");
  $("walls").querySelectorAll(".chp").forEach(function (b) {
    b.onclick = function () { $("walls").querySelectorAll(".chp").forEach(function (x) { x.classList.remove("on"); }); b.classList.add("on"); $("stage").className = "stage " + b.getAttribute("data-w"); };
  });

  function mark() {
    ["theme", "text", "h24", "bold", "date", "bgmode"].forEach(function (id) {
      var key = id === "bgmode" ? "opacity" : id;
      $(id).querySelectorAll(".chp").forEach(function (b) { b.classList.toggle("on", JSON.parse(b.getAttribute("data-v")) === cfg[key]); });
    });
    $("accent").querySelectorAll(".sw").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-v") === cfg.accent); });
    $("opacity").value = cfg.opacity; $("opv").textContent = cfg.opacity === 0 ? "Trong suốt" : cfg.opacity + "%";
    ["lunar", "weather", "week", "place", "tuoi"].forEach(function (k) { $(k).checked = !!cfg[k]; });
  }

  function render() {
    var p = pal(), L = Lunar.solar2Lunar(d, m, y), wk = Lunar.isoWeek(d, m, y), w = data && data.w, cur = w && w.current;
    $("bgl").style.background = p.surface; $("bgl").style.opacity = cfg.opacity / 100;
    $("wg").className = "wg" + (p.wall ? " wall" : ""); $("wg").style.color = p.fg;
    $("wg").style.maxWidth = TYPE === "calendar" ? "170px" : "360px";
    var hh = cfg.h24 ? pad(now.getHours()) : ((now.getHours() % 12) || 12);
    var ck = function (size) { return '<div class="ck" style="font-size:' + size + "px;font-weight:" + (cfg.bold ? 500 : 300) + ";color:" + p.acc + '">' + hh + ":" + pad(now.getMinutes()) + "</div>"; };
    var cp = function (txt, kind) { return '<span class="cp" style="background:' + (kind ? p.cB : p.cA) + ";color:" + (kind ? p.oB : p.oA) + '">' + txt + "</span>"; };
    var dm = L.day + "/" + L.month + (L.leap ? "N" : "");
    var wIc = function (s, code, day) { return '<span class="wi" style="width:' + s + "px;height:" + s + 'px">' + (cur ? WX.icon(code == null ? cur.weather_code : code, day == null ? cur.is_day : day) : WX_ICONS.partly_day) + "</span>"; };
    var temp = cur ? Math.round(cur.temperature_2m) + "°" : "--°";
    var place = (data && data.place ? data.place.split(",")[0] : "Vị trí hiện tại").replace("Thành phố ", "TP. ").replace("Phường ", "P. ").replace("Quận ", "Q. ");
    var upd = pad(now.getHours()) + ":" + pad(now.getMinutes());
    var rf = '<span class="rf" style="background:' + p.cB + ';color:' + p.acc + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span>';
    var hint = w ? WX.rainHint(w) : "Mở app để lấy vị trí";
    var dateT = cfg.date === "long" ? THU[wd] + ", " + d + " tháng " + m : cfg.date === "short" ? THU_N[wd] + " · " + pad(d) + "/" + pad(m) : THU[wd] + ", " + pad(d) + "/" + pad(m) + "/" + y;
    var h = "";
    if (TYPE === "clock") {
      h = '<div class="row"><div class="f1">' + ck(46) + "</div>" +
        (cfg.weather ? '<div style="text-align:right"><div class="row" style="justify-content:flex-end">' + wIc(32) + '<span style="font-size:26px;font-weight:600;margin-left:4px">' + temp + "</span></div>" +
          '<div style="font-size:11px;color:' + p.fg2 + '">' + (cur ? WX.desc(cur.weather_code) + " · " + Math.round(w.daily.temperature_2m_max[0]) + "°/" + Math.round(w.daily.temperature_2m_min[0]) + "°" : "") + "</div></div>" : "") + "</div>" +
        '<div class="ell" style="font-size:14px;font-weight:600;margin-top:6px">' + dateT + (cfg.week ? " · Tuần " + wk : "") + "</div>" +
        '<div class="row" style="margin-top:3px;font-size:12px;color:' + p.fg2 + '"><div class="f1 ell">' + (cfg.lunar ? "Âm lịch " + dm + " · " + Lunar.canChiYear(L.year) : "") + "</div>" +
        (cfg.weather && cfg.place ? '<span class="ell" style="font-size:11px;max-width:140px;margin-left:8px">' + place + "</span>" : "") + "</div>" +
        (cfg.weather ? '<div class="row" style="margin-top:6px"><div class="f1">' + cp(hint, 1) + '</div><span style="font-size:10px;color:' + p.fg2 + '">' + upd + "</span>" + rf + "</div>" : "");
    } else if (TYPE === "date") {
      var t = birth ? Lunar.tuoi.apply(null, birth.split("-").map(Number).reverse()) : null, g = Lunar.danhGia(d, m, y, t && cfg.tuoi ? t.chi : null);
      var l3 = t && cfg.tuoi ? "Tuổi " + t.chiName + ": " + g.muc : "Ngày " + (g.hoangDao ? "Hoàng đạo" : "Hắc đạo") + " · " + g.than;
      var l4 = "Giờ tốt: " + (t && cfg.tuoi ? g.gioTot : Lunar.gioHoangDao(L.jd)).slice(0, 4).map(function (x) { return x.split(" ")[0]; }).join(", ");
      h = '<div class="row"><div style="width:84px;text-align:center;flex:none"><div style="font-size:13px;font-weight:600;color:' + (wd === 0 ? p.red : p.fg) + '">' + THU[wd] + '</div><div style="font-size:50px;font-weight:600;line-height:1.05;color:' + p.acc + '">' + d +
        '</div><div style="font-size:11px;color:' + p.fg2 + '">Tháng ' + m + " · " + y + '</div></div><div class="f1" style="margin-left:12px">' + (cfg.week ? cp("Tuần " + wk, 1) + " " : "") + cp("ÂL " + dm, 0) +
        '<div class="ell" style="font-size:12px;margin-top:8px">Ngày ' + Lunar.canChiDay(L.jd) + " · tháng " + Lunar.canChiMonth(L.month, L.year) + '</div><div class="ell" style="font-size:11px;color:' + p.fg2 + ';margin-top:5px">Năm ' + Lunar.canChiYear(L.year) +
        " · tháng " + THANG[L.month] + '</div><div class="ell" style="font-size:11px;font-weight:600;margin-top:4px">' + l3 + '</div><div class="ell" style="font-size:11px;color:' + p.fg2 + ';margin-top:4px">' + l4 + "</div></div></div>";
    } else if (TYPE === "weather") {
      var hrs = "";
      if (w) { var i0 = WX.hourIndex(w); for (var k = 0; k < 5; k++) { var i = i0 + 1 + k * 2; if (i >= w.hourly.time.length) break;
        hrs += '<div style="flex:1;text-align:center"><div style="font-size:11px;color:' + p.fg2 + '">' + WX.hourOf(w.hourly.time[i]) + "h</div>" + wIc(26, w.hourly.weather_code[i], w.hourly.is_day[i]) +
          '<div style="font-size:13px;font-weight:600">' + Math.round(w.hourly.temperature_2m[i]) + '°</div><div style="font-size:10px;color:' + p.rain + '">' + WX.popText(w.hourly, i) + "</div></div>"; } }
      h = '<div class="row"><div class="f1 ell" style="font-size:12px;font-weight:600">' + (cfg.place ? place : "") + '</div><span style="font-size:10px;color:' + p.fg2 + '">' + upd + "</span>" + rf + "</div>" +
        '<div class="row" style="margin-top:4px">' + wIc(46) + '<span style="font-size:36px;font-weight:600;margin-left:6px">' + temp + '</span><div class="f1" style="margin-left:12px"><div class="ell" style="font-size:13px;font-weight:600">' +
        (cur ? WX.desc(cur.weather_code) + " · ẩm " + cur.relative_humidity_2m + "%" : "Chưa có dữ liệu") + '</div><div class="ell" style="font-size:11px;color:' + p.fg2 + ';margin-top:4px">' +
        (w ? "Cảm giác " + Math.round(cur.apparent_temperature) + "° · " + Math.round(w.daily.temperature_2m_max[0]) + "°/" + Math.round(w.daily.temperature_2m_min[0]) + "°" : "") + "</div></div></div>" +
        '<div class="row" style="margin:10px 0 8px">' + hrs + "</div>" + (cfg.weather ? cp(hint, 1) : "");
    } else if (TYPE === "calendar") {
      h = '<div class="row"><div class="f1" style="font-size:12px;font-weight:600;color:' + (wd === 0 ? p.red : p.fg) + '">' + THU[wd] + "</div>" + (cfg.week ? cp("T" + wk, 1) : "") + "</div>" +
        '<div style="font-size:50px;font-weight:600;line-height:1.1;color:' + p.acc + ';margin-top:4px">' + d + '</div><div style="font-size:11px;color:' + p.fg2 + '">Tháng ' + m + " · " + y + "</div>" +
        '<div class="row" style="margin-top:8px">' + (cfg.lunar ? cp("ÂL " + dm, 0) : "") + '<span class="f1"></span>' + (cfg.weather ? wIc(18) + '<span style="font-size:12px;margin-left:3px">' + temp + "</span>" : "") + "</div>";
    } else {
      h = '<div class="row">' + ck(32) + '<span style="width:1px;height:30px;background:' + p.fg2 + ';opacity:.5;margin:0 12px"></span><div class="f1"><div class="ell" style="font-size:13px;font-weight:600">' + THU_N[wd] + ", " + pad(d) + "/" + pad(m) +
        (cfg.week ? " · T" + wk : "") + "</div>" + (cfg.lunar ? '<div class="ell" style="font-size:11px;color:' + p.fg2 + ';margin-top:3px">ÂL ' + dm + " · " + Lunar.canChiYear(L.year) + "</div>" : "") + "</div>" +
        (cfg.weather ? wIc(28) + '<span style="font-size:20px;font-weight:600;margin-left:4px">' + temp + "</span>" : "") + "</div>";
    }
    $("content").innerHTML = h;
  }
  function sync() { mark(); render(); }
  $("btnSave").onclick = function () { B.save(JSON.stringify(cfg)); };
  $("btnCancel").onclick = $("btnBack").onclick = function () { B.cancel(); };
  sync();
})();
</script>
</body>
</html>
